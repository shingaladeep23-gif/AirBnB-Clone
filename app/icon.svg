<!--
  Favicon. Next's App Router serves any app/icon.* automatically and injects the
  <link rel="icon">, so this file alone is the whole fix.

  WHY IT EXISTS: real Chrome requests /favicon.ico unconditionally, and with no
  icon in the tree that 404s. It is invisible on the page but it is a console
  error, and "no console errors" is one of the assertions this project holds
  itself to — a permanently-red check trains everyone to ignore the console,
  which is how a real error gets missed.

  The glyph is our own rounded bélo-style path — the same one LogoMark draws in
  components/ui/icons.tsx, NOT the reference's SVG path data. Keep the two in
  sync by hand; a 32x32 favicon does not justify a build step.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
