    d="M16 3c-1.6 0-2.8 1-3.7 2.7C9.7 10.4 4 21 4 24.6 4 27.6 6.2 29.6 9 29.6c2.5 0 4.8-1.4 7-4.1 2.2 2.7 4.5 4.1 7 4.1 2.8 0 5-2 5-5 0-3.6-5.7-14.2-8.3-18.9C18.8 4 17.6 3 16 3zm0 3.2c.5 0 .9.4 1.4 1.3 2.6 4.7 7.6 14.3 7.6 17.1 0 1.3-.8 2-2 2-1.6 0-3.4-1.3-5.2-3.7 1.6-2.2 2.7-4.2 2.7-6.1 0-2.7-1.9-4.6-4.5-4.6s-4.5 1.9-4.5 4.6c0 1.9 1.1 3.9 2.7 6.1-1.8 2.4-3.6 3.7-5.2 3.7-1.2 0-2-.7-2-2 0-2.8 5-12.4 7.6-17.1.5-.9.9-1.3 1.4-1.3zm0 9.1c1 0 1.6.7 1.6 1.8 0 1-.6 2.3-1.6 3.8-1-1.5-1.6-2.8-1.6-3.8 0-1.1.6-1.8 1.6-1.8z"
